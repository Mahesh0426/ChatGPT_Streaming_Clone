# ──────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml – ChatGPT Streaming Clone
#
#  Services:
#    • migrate – applies Prisma migrations to the configured Neon database
#    • app     – Next.js application (standalone output)
#  Both services use the same production image.
#
#  Usage:
#    1. cp .env.example .env  →  fill in your real values
#    2. docker compose up --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────────────────────
  #  One-off migration runner using the CLI bundled in the shared app image.
  # ────────────────────────────────────────────────────────────────────────────
  migrate:
    image: chatgpt-clone:latest
    pull_policy: never
    working_dir: /migrate
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon connection string in .env}
    restart: "no"

  # ────────────────────────────────────────────────────────────────────────────
  #  Next.js Application
  # ────────────────────────────────────────────────────────────────────────────
  app:
    image: chatgpt-clone:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be known at build time (baked into JS bundle)
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    container_name: chatgpt_clone_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Runtime secrets — injected from .env, never baked into the image
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon connection string in .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      # Re-expose public vars at runtime as well (some libs read them server-side)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
    ports:
      - "3001:3000"
